[project]
name = "simbench_exp"
version = "0.1.0"
description = "Predicting human survey response distributions with SimBench"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.24",
    "tqdm>=4.66",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "nbstripout>=0.9.1",
]

[project.scripts]
simbench-ask = "simbench_exp.cli_ask:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simbench_exp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
